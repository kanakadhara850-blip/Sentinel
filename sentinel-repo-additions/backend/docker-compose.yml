# Optional production-like dependencies. The app also runs without them (in-memory bus + feature store).
#   docker compose up -d      then:  BUS_BACKEND=kafka REDIS_URL=redis://localhost:6379/0 python -m app.main
services:
  kafka:
    image: apache/kafka:3.7.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  postgres:            # optional: apply app/db/schema_postgres.sql (production DDL; app runtime uses SQLite)
    image: postgres:16-alpine
    environment: {POSTGRES_PASSWORD: change-me, POSTGRES_DB: risk}
    ports: ["5432:5432"]
    volumes: ["./app/db/schema_postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro"]
